<svg xmlns="http://www.w3.org/2000/svg" version="1.1" role="img" width="1160" height="310" viewBox="0 0 1160 310" font-family="Lato, Arial, 'Liberation Sans', Helvetica, sans-serif">
<title>Keeping work aligned with the original request</title>
<desc>The original request is stored word for word with a hash. Every brief carries it. The agent&#x27;s result goes through a drift check that compares it against the original request; a result that drops a named requirement is escalated to the person.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5763"/></marker></defs>
<rect x="0" y="0" width="1160" height="310" fill="#f5f6f8"/>
<path d="M260,82 L320,82" fill="none" stroke="#4f5763" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M540,82 L600,82" fill="none" stroke="#4f5763" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M820,82 L880,82" fill="none" stroke="#4f5763" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M960,125 L960,155 L700,155 L700,185" fill="none" stroke="#4f5763" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M840,232 L930,232" fill="none" stroke="#4f5763" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="885" y="220" font-size="14" fill="#15181d" text-anchor="middle" font-style="italic">drops one</text>
<path d="M145,125 L145,232 L560,232" fill="none" stroke="#4f5763" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)" stroke-dasharray="7 5"/>
<text x="350" y="222" font-size="14" fill="#15181d" text-anchor="middle" font-style="italic">compared against</text>
<rect x="30" y="40" width="230" height="85" rx="10" fill="#fdf1e3" stroke="#9a5b13" stroke-width="2"/>
<text x="145" y="67" font-size="16" fill="#15181d" text-anchor="middle" font-weight="700">Original request</text>
<text x="145" y="88" font-size="16" fill="#15181d" text-anchor="middle">stored word for word</text>
<text x="145" y="109" font-size="16" fill="#15181d" text-anchor="middle">with a hash</text>
<rect x="320" y="40" width="220" height="85" rx="10" fill="#ffffff" stroke="#4f5763" stroke-width="2"/>
<text x="430" y="67" font-size="16" fill="#15181d" text-anchor="middle" font-weight="700">Brief</text>
<text x="430" y="88" font-size="16" fill="#15181d" text-anchor="middle">carries the request</text>
<text x="430" y="109" font-size="16" fill="#15181d" text-anchor="middle">unchanged</text>
<rect x="600" y="40" width="220" height="85" rx="10" fill="#e8f1f4" stroke="#0e5a75" stroke-width="2"/>
<text x="710" y="78" font-size="16" fill="#15181d" text-anchor="middle" font-weight="700">Agent works</text>
<text x="710" y="98" font-size="16" fill="#15181d" text-anchor="middle">decides, delegates</text>
<rect x="880" y="40" width="160" height="85" rx="10" fill="#ffffff" stroke="#4f5763" stroke-width="2"/>
<text x="960" y="88" font-size="16" fill="#15181d" text-anchor="middle" font-weight="700">Result</text>
<rect x="560" y="185" width="280" height="95" rx="10" fill="#eef3e8" stroke="#3f6b2a" stroke-width="2"/>
<text x="700" y="217" font-size="16" fill="#15181d" text-anchor="middle" font-weight="700">Drift check</text>
<text x="700" y="238" font-size="16" fill="#15181d" text-anchor="middle">every named requirement</text>
<text x="700" y="259" font-size="16" fill="#15181d" text-anchor="middle">kept, or escalated?</text>
<rect x="930" y="195" width="200" height="75" rx="10" fill="#f9e9e9" stroke="#8a2d2d" stroke-width="2"/>
<text x="1030" y="228" font-size="16" fill="#15181d" text-anchor="middle" font-weight="700">Escalate</text>
<text x="1030" y="248" font-size="16" fill="#15181d" text-anchor="middle">to the person</text>
</svg>
