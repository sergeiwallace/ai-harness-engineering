<svg xmlns="http://www.w3.org/2000/svg" version="1.1" role="img" width="1180" height="330" viewBox="0 0 1180 330" font-family="Lato, Arial, 'Liberation Sans', Helvetica, sans-serif">
<title>How a tool call is allowed, asked about or refused</title>
<desc>A tool call passes through layers in order: deny rules refuse it, a pre-tool hook can refuse it or ask, ask rules prompt the person, allow rules let it run, and otherwise the permission mode decides, where auto mode lets a classifier approve routine actions.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5763"/></marker></defs>
<rect x="0" y="0" width="1180" height="330" fill="#f5f6f8"/>
<path d="M180,160 L230,160" fill="none" stroke="#4f5763" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M390,160 L440,160" fill="none" stroke="#4f5763" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="415" y="115" font-size="14" fill="#15181d" text-anchor="middle" font-style="italic">no match</text>
<path d="M620,160 L670,160" fill="none" stroke="#4f5763" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="645" y="112" font-size="14" fill="#15181d" text-anchor="middle" font-style="italic">no decision</text>
<path d="M820,160 L870,160" fill="none" stroke="#4f5763" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="845" y="115" font-size="14" fill="#15181d" text-anchor="middle" font-style="italic">no match</text>
<path d="M310,125 L310,75" fill="none" stroke="#4f5763" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="345" y="105" font-size="14" fill="#15181d" text-anchor="middle" font-style="italic">match</text>
<path d="M745,125 L745,75" fill="none" stroke="#4f5763" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="775" y="105" font-size="14" fill="#15181d" text-anchor="middle" font-style="italic">match</text>
<path d="M945,125 L945,100 L1110,100 L1110,75" fill="none" stroke="#4f5763" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="1030" y="92" font-size="14" fill="#15181d" text-anchor="middle" font-style="italic">match</text>
<path d="M945,195 L945,212 L965,225" fill="none" stroke="#4f5763" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="1010" y="215" font-size="14" fill="#15181d" text-anchor="middle" font-style="italic">no match</text>
<rect x="30" y="125" width="150" height="70" rx="10" fill="#e8f1f4" stroke="#0e5a75" stroke-width="2"/>
<text x="105" y="166" font-size="16" fill="#15181d" text-anchor="middle" font-weight="700">Tool call</text>
<rect x="230" y="125" width="160" height="70" rx="10" fill="#f9e9e9" stroke="#8a2d2d" stroke-width="2"/>
<text x="310" y="166" font-size="16" fill="#15181d" text-anchor="middle" font-weight="700">Deny rules</text>
<rect x="440" y="120" width="180" height="80" rx="10" fill="#eef3e8" stroke="#3f6b2a" stroke-width="2"/>
<text x="530" y="155" font-size="16" fill="#15181d" text-anchor="middle" font-weight="700">Pre-tool hook</text>
<text x="530" y="176" font-size="16" fill="#15181d" text-anchor="middle">your own code</text>
<rect x="670" y="125" width="150" height="70" rx="10" fill="#fdf1e3" stroke="#9a5b13" stroke-width="2"/>
<text x="745" y="166" font-size="16" fill="#15181d" text-anchor="middle" font-weight="700">Ask rules</text>
<rect x="870" y="125" width="150" height="70" rx="10" fill="#eef3e8" stroke="#3f6b2a" stroke-width="2"/>
<text x="945" y="166" font-size="16" fill="#15181d" text-anchor="middle" font-weight="700">Allow rules</text>
<rect x="800" y="225" width="330" height="95" rx="10" fill="#ffffff" stroke="#4f5763" stroke-width="2"/>
<text x="965" y="247" font-size="16" fill="#15181d" text-anchor="middle" font-weight="700">Permission mode</text>
<text x="965" y="268" font-size="16" fill="#15181d" text-anchor="middle">default, plan, accept edits,</text>
<text x="965" y="288" font-size="16" fill="#15181d" text-anchor="middle">auto: a classifier approves</text>
<text x="965" y="309" font-size="16" fill="#15181d" text-anchor="middle">routine actions</text>
<rect x="230" y="20" width="160" height="55" rx="10" fill="#f9e9e9" stroke="#8a2d2d" stroke-width="2"/>
<text x="310" y="53" font-size="16" fill="#15181d" text-anchor="middle" font-weight="700">Refused</text>
<rect x="630" y="20" width="230" height="55" rx="10" fill="#fdf1e3" stroke="#9a5b13" stroke-width="2"/>
<text x="745" y="53" font-size="16" fill="#15181d" text-anchor="middle" font-weight="700">Prompt the person</text>
<rect x="1060" y="20" width="100" height="55" rx="10" fill="#eef3e8" stroke="#3f6b2a" stroke-width="2"/>
<text x="1110" y="53" font-size="16" fill="#15181d" text-anchor="middle" font-weight="700">Runs</text>
</svg>
