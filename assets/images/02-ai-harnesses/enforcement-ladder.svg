<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">The enforcement ladder</title>
  <desc id="d">Five steps rising from left to right. A context rule is the softest and cheapest. A path rule loads for some files. A skill fixes the steps of a procedure. A hook or guard checks the action as the agent takes it. A test or CI gate checks the result at commit, push or merge and is the hardest. Each rule goes as far right as it can be checked; the context rule stays as a second layer.</desc>
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2933">The enforcement ladder</text>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
  <g font-size="14" fill="#1f2933">
    <rect x="30" y="300" width="160" height="80" rx="8" fill="#f1f3f5" stroke="#9aa5b1"/><text x="110" y="334" text-anchor="middle" font-weight="bold">Context rule</text><text x="110" y="356" text-anchor="middle" font-size="12">read, usually followed</text>
    <rect x="200" y="250" width="160" height="130" rx="8" fill="#e6effa" stroke="#4a7ab8"/><text x="280" y="284" text-anchor="middle" font-weight="bold">Path rule</text><text x="280" y="306" text-anchor="middle" font-size="12">loads for some files</text>
    <rect x="370" y="200" width="160" height="180" rx="8" fill="#d5e4f6" stroke="#4a7ab8"/><text x="450" y="234" text-anchor="middle" font-weight="bold">Skill</text><text x="450" y="256" text-anchor="middle" font-size="12">fixed steps on use</text>
    <rect x="540" y="150" width="160" height="230" rx="8" fill="#fbe3cf" stroke="#c0712f"/><text x="620" y="184" text-anchor="middle" font-weight="bold">Hook or guard</text><text x="620" y="206" text-anchor="middle" font-size="12">checked as it acts</text>
    <rect x="710" y="100" width="160" height="280" rx="8" fill="#f6c9a3" stroke="#c0712f"/><text x="790" y="134" text-anchor="middle" font-weight="bold">Test or CI gate</text><text x="790" y="156" text-anchor="middle" font-size="12">checked on the result</text>
  </g>
  <line x1="60" y1="404" x2="850" y2="404" stroke="#52606d" stroke-width="2" marker-end="url(#m)"/>
  <text x="450" y="424" text-anchor="middle" font-size="13" fill="#52606d">instructions on the left guide; workflows, hooks and tests on the right enforce</text>
</svg>
