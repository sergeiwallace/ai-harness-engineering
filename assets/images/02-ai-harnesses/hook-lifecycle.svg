<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">Where hooks fire in a session</title>
  <desc id="d">A session runs left to right. SessionStart fires once when it opens. UserPromptSubmit fires on each prompt. Inside the agent loop, PreToolUse fires before every tool call and can block it, the tool runs, then PostToolUse fires and can feed a message back. Stop fires when the agent wants to end its turn and can send it back to work. PreCompact fires before the context is summarised, SubagentStop when a sub-agent finishes, and SessionEnd when the session closes.</desc>
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2933">Where hooks fire in a session</text>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
  <rect x="350" y="80" width="430" height="200" rx="16" fill="#f5f7fa" stroke="#9aa5b1" stroke-dasharray="6 4"/>
  <text x="565" y="104" text-anchor="middle" font-size="13" fill="#52606d">agent loop, once per tool call</text>
  <g font-size="14" fill="#1f2933">
    <rect x="20" y="150" width="120" height="56" rx="10" fill="#eef7ee" stroke="#3f8a4f"/><text x="80" y="183" text-anchor="middle">SessionStart</text>
    <rect x="170" y="150" width="150" height="56" rx="10" fill="#eef7ee" stroke="#3f8a4f"/><text x="245" y="183" text-anchor="middle">UserPromptSubmit</text>
    <rect x="370" y="150" width="120" height="56" rx="10" fill="#fdf0e6" stroke="#c0712f"/><text x="430" y="176" text-anchor="middle">PreToolUse</text><text x="430" y="195" text-anchor="middle" font-size="12">can block</text>
    <rect x="510" y="150" width="110" height="56" rx="10" fill="#ffffff" stroke="#52606d"/><text x="565" y="183" text-anchor="middle">tool runs</text>
    <rect x="640" y="150" width="125" height="56" rx="10" fill="#fdf0e6" stroke="#c0712f"/><text x="702" y="176" text-anchor="middle">PostToolUse</text><text x="702" y="195" text-anchor="middle" font-size="12">can feed back</text>
    <rect x="810" y="150" width="130" height="56" rx="10" fill="#fdf0e6" stroke="#c0712f"/><text x="875" y="176" text-anchor="middle">Stop</text><text x="875" y="195" text-anchor="middle" font-size="12">can send it back</text>
    <rect x="370" y="310" width="140" height="48" rx="10" fill="#e8f1fb" stroke="#4a7ab8"/><text x="440" y="339" text-anchor="middle">PreCompact</text>
    <rect x="540" y="310" width="150" height="48" rx="10" fill="#e8f1fb" stroke="#4a7ab8"/><text x="615" y="339" text-anchor="middle">SubagentStop</text>
    <rect x="800" y="310" width="140" height="48" rx="10" fill="#eef7ee" stroke="#3f8a4f"/><text x="870" y="339" text-anchor="middle">SessionEnd</text>
  </g>
  <g stroke="#52606d" stroke-width="2" fill="none">
    <line x1="140" y1="178" x2="166" y2="178" marker-end="url(#m)"/>
    <line x1="320" y1="178" x2="366" y2="178" marker-end="url(#m)"/>
    <line x1="490" y1="178" x2="506" y2="178" marker-end="url(#m)"/>
    <line x1="620" y1="178" x2="636" y2="178" marker-end="url(#m)"/>
    <line x1="765" y1="178" x2="806" y2="178" marker-end="url(#m)"/>
    <path d="M702,150 C702,120 430,120 430,146" marker-end="url(#m)"/>
    <path d="M875,206 C875,250 245,250 245,210" stroke-dasharray="5 4" marker-end="url(#m)"/>
    <line x1="875" y1="206" x2="870" y2="306" marker-end="url(#m)"/>
  </g>
  <text x="565" y="242" text-anchor="middle" font-size="12" fill="#52606d">next prompt</text>
</svg>
