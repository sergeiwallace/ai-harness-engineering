<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">The enforcement ladder</title>
  <desc id="d">Five steps from least to most enforced: context rule, path rule, skill, hook or guard, test or CI gate. Each step up is checked more consistently and costs more to build and run. A rule goes to the highest step that can check it, and the context rule stays as the reason.</desc>
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2937">The enforcement ladder</text>
  <g font-size="15">
    <rect x="40"  y="300" width="200" height="60" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="140" y="326" text-anchor="middle" font-weight="600" fill="#111827">1 Context rule</text>
    <text x="140" y="346" text-anchor="middle" font-size="12" fill="#374151">read by the model</text>
    <rect x="140" y="236" width="200" height="60" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="240" y="262" text-anchor="middle" font-weight="600" fill="#1e1b4b">2 Path rule</text>
    <text x="240" y="282" text-anchor="middle" font-size="12" fill="#312e81">read for matching files</text>
    <rect x="240" y="172" width="200" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="340" y="198" text-anchor="middle" font-weight="600" fill="#1e3a8a">3 Skill</text>
    <text x="340" y="218" text-anchor="middle" font-size="12" fill="#1e3a8a">fixed steps when it runs</text>
    <rect x="340" y="108" width="200" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="440" y="134" text-anchor="middle" font-weight="600" fill="#14532d">4 Hook or guard</text>
    <text x="440" y="154" text-anchor="middle" font-size="12" fill="#14532d">checked as the agent acts</text>
    <rect x="440" y="44"  width="200" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="540" y="70" text-anchor="middle" font-weight="600" fill="#78350f">5 Test or CI gate</text>
    <text x="540" y="90" text-anchor="middle" font-size="12" fill="#78350f">checked on the result</text>
  </g>
  <line x1="680" y1="350" x2="680" y2="60" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <text x="700" y="210" font-size="13" fill="#374151" transform="rotate(-90 700 210)" text-anchor="middle">more consistent, more costly</text>
  <text x="40" y="388" font-size="13" fill="#374151">Put a rule at the highest step that can check it. The context rule stays as the reason.</text>
</svg>
