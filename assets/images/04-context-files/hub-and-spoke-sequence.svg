<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 638" role="img" aria-labelledby="archify-diagram-title archify-diagram-description"><style>text{font-family:Inter,'Helvetica Neue',Helvetica,Arial,sans-serif}.c-grid{stroke: #e9edf2; fill: none;}.c-mask{fill: #ffffff; stroke: none;}.c-frontend{fill: rgba(34, 211, 238, 0.15);   stroke: #0891b2;}.c-backend{fill: rgba(52, 211, 153, 0.18);    stroke: #059669;}.c-database{fill: rgba(167, 139, 250, 0.2);   stroke: #7c3aed;}.c-cloud{fill: rgba(251, 191, 36, 0.18);      stroke: #d97706;}.c-external{fill: rgba(148, 163, 184, 0.18);   stroke: #64748b;}.t-primary{fill: #111827;}.t-muted{fill: #5b6474;}.t-edge-emphasis{fill: #059669;}.a-default{stroke: #64748b; fill: none;}.a-emphasis{stroke: #059669; fill: none;}.m-default{fill: #64748b;}.m-emphasis{fill: #059669;}.m-security{fill: #e11d48;}.m-dashed{fill: #7c3aed;}.c-lane{fill: rgba(248, 250, 252, 0.65); stroke: #cbd5e1; stroke-dasharray: 6,6;}</style>
        <title id="archify-diagram-title">Hub and spoke during a release task</title>
        <desc id="archify-diagram-description">A sequence diagram generated by Archify.</desc>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Time Segments -->
        <rect x="48" y="150" width="824" height="80" rx="10" class="c-lane" stroke-width="1"/>

        <rect x="48" y="242" width="824" height="158" rx="10" class="c-lane" stroke-width="1"/>

        <rect x="48" y="412" width="824" height="128" rx="10" class="c-lane" stroke-width="1"/>

        <!-- Lifelines -->
        <path d="M 129.5 142 L 129.5 542" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 300.25 142 L 300.25 542" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 471 142 L 471 542" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 641.75 142 L 641.75 542" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 812.5 142 L 812.5 542" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>

        <!-- Activations -->
        <rect x="466" y="165" width="10" height="365" rx="3" class="c-mask"/>
        <rect x="466" y="165" width="10" height="365" rx="3" class="c-backend" stroke-width="1"/>
        <rect x="636.75" y="300" width="10" height="40" rx="3" class="c-mask"/>
        <rect x="636.75" y="300" width="10" height="40" rx="3" class="c-database" stroke-width="1"/>
        <rect x="807.5" y="430" width="10" height="65" rx="3" class="c-mask"/>
        <rect x="807.5" y="430" width="10" height="65" rx="3" class="c-cloud" stroke-width="1"/>

        <!-- Messages -->
        <g>
          <path d="M 307.25 165 L 464 165" class="a-default" style="--step:0" stroke-width="1.4" marker-end="url(#arrowhead)"/>
        <g>
          <rect x="254.22500000000002" y="145" width="262.79999999999995" height="18" rx="3" class="c-mask"/>
          <text x="385.625" y="155" class="t-muted" font-size="11" text-anchor="middle">Before a release, read docs/release.md</text>
        </g>
        <text x="319.25" y="183" class="t-muted" font-size="7">the other spokes stay unread</text>
        </g>

        <g>
          <path d="M 136.5 265 L 464 265" class="a-emphasis" style="--step:1" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <g>
          <rect x="244.75" y="245" width="111" height="18" rx="3" class="c-mask"/>
          <text x="300.25" y="255" class="t-edge-emphasis" font-size="11" text-anchor="middle">cut release 2.4</text>
        </g>
        </g>

        <g>
          <path d="M 478 300 L 634.75 300" class="a-emphasis" style="--step:2" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <g>
          <rect x="448.075" y="280" width="216.6" height="18" rx="3" class="c-mask"/>
          <text x="556.375" y="290" class="t-edge-emphasis" font-size="11" text-anchor="middle">trigger matched: read the spoke</text>
        </g>
        </g>

        <g>
          <path d="M 634.75 335 L 478 335" class="a-default" style="--step:3" stroke-width="1.4" stroke-dasharray="3,5" marker-end="url(#arrowhead)"/>
        <g>
          <rect x="408.475" y="315" width="295.8" height="18" rx="3" class="c-mask"/>
          <text x="556.375" y="325" class="t-muted" font-size="11" text-anchor="middle">steps: full suite, changelog, tag from main</text>
        </g>
        </g>

        <g>
          <path d="M 478 430 L 805.5 430" class="a-emphasis" style="--step:4" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <g>
          <rect x="576.35" y="410" width="130.8" height="18" rx="3" class="c-mask"/>
          <text x="641.75" y="420" class="t-edge-emphasis" font-size="11" text-anchor="middle">run the full suite</text>
        </g>
        </g>

        <g>
          <path d="M 805.5 460 L 478 460" class="a-default" style="--step:5" stroke-width="1.4" stroke-dasharray="3,5" marker-end="url(#arrowhead)"/>
        <g>
          <rect x="609.35" y="440" width="64.8" height="18" rx="3" class="c-mask"/>
          <text x="641.75" y="450" class="t-muted" font-size="11" text-anchor="middle">0 failed</text>
        </g>
        </g>

        <g>
          <path d="M 478 490 L 805.5 490" class="a-emphasis" style="--step:6" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <g>
          <rect x="546.65" y="470" width="190.2" height="18" rx="3" class="c-mask"/>
          <text x="641.75" y="480" class="t-edge-emphasis" font-size="11" text-anchor="middle">changelog, tag v2.4 on main</text>
        </g>
        </g>

        <g>
          <path d="M 464 525 L 136.5 525" class="a-default" style="--step:7" stroke-width="1.4" stroke-dasharray="3,5" marker-end="url(#arrowhead)"/>
        <g>
          <rect x="215.05" y="505" width="170.39999999999998" height="18" rx="3" class="c-mask"/>
          <text x="300.25" y="515" class="t-muted" font-size="11" text-anchor="middle">released, steps followed</text>
        </g>
        </g>

        <!-- Segment Labels -->
        <g>
          <rect x="56" y="134" width="81.60000000000001" height="18" rx="3" class="c-mask"/>
          <text x="62" y="147" class="t-muted" font-size="9" font-weight="600">Always loaded</text>
        </g>
        <g>
          <rect x="56" y="220" width="81.60000000000001" height="18" rx="3" class="c-mask"/>
          <text x="62" y="233" class="t-muted" font-size="9" font-weight="600">Trigger fires</text>
        </g>
        <g>
          <rect x="56" y="390" width="118" height="18" rx="3" class="c-mask"/>
          <text x="62" y="403" class="t-muted" font-size="9" font-weight="600">Steps from the spoke</text>
        </g>

        <!-- Participants -->
        <g id="node-you" role="button" aria-label="Focus You, ask for a release, Sequence participant" aria-pressed="false">
          <title>You · ask for a release · Sequence participant</title>
          <rect x="62" y="72" width="135" height="60" rx="6" class="c-mask"/>
          <rect x="62" y="72" width="135" height="60" rx="6" class="c-external" style="--step:0" stroke-width="1.5"/>
          <g aria-hidden="true" class="semantic-sigil s-external" transform="translate(68 78) scale(0.6875)">
            <rect x="2.5" y="5" width="8.5" height="8" rx="1.5"/>
            <path d="M8 2.5h5.5V8M13.5 2.5 7.5 8.5"/>
          </g>
          <text x="129.5" y="108" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">You</text>
          <text x="129.5" y="122" class="t-muted" font-size="7" text-anchor="middle">ask for a release</text>
        </g>

        <g id="node-hub" role="button" aria-label="Focus CLAUDE.md hub, one line per rule, Sequence participant" aria-pressed="false">
          <title>CLAUDE.md hub · one line per rule · Sequence participant</title>
          <rect x="232.75" y="72" width="135" height="60" rx="6" class="c-mask"/>
          <rect x="232.75" y="72" width="135" height="60" rx="6" class="c-frontend" style="--step:1" stroke-width="1.5"/>
          <g aria-hidden="true" class="semantic-sigil s-frontend" transform="translate(238.75 78) scale(0.6875)">
            <rect x="2" y="3" width="12" height="10" rx="2"/>
            <path d="M2 6.5h12"/>
            <circle cx="4.1" cy="4.8" r=".7" class="sigil-fill"/>
            <circle cx="6.3" cy="4.8" r=".7" class="sigil-fill"/>
          </g>
          <text x="300.25" y="108" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">CLAUDE.md hub</text>
          <text x="300.25" y="122" class="t-muted" font-size="7" text-anchor="middle">one line per rule</text>
        </g>

        <g id="node-agent" role="button" aria-label="Focus Agent, the session, Sequence participant" aria-pressed="false">
          <title>Agent · the session · Sequence participant</title>
          <rect x="403.5" y="72" width="135" height="60" rx="6" class="c-mask"/>
          <rect x="403.5" y="72" width="135" height="60" rx="6" class="c-backend" style="--step:2" stroke-width="1.5"/>
          <g aria-hidden="true" class="semantic-sigil s-backend" transform="translate(409.5 78) scale(0.6875)">
            <path d="M6 3 3 8l3 5M10 3l3 5-3 5"/>
          </g>
          <text x="471" y="108" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Agent</text>
          <text x="471" y="122" class="t-muted" font-size="7" text-anchor="middle">the session</text>
        </g>

        <g id="node-spoke" role="button" aria-label="Focus docs/release.md, the spoke, Sequence participant" aria-pressed="false">
          <title>docs/release.md · the spoke · Sequence participant</title>
          <rect x="574.25" y="72" width="135" height="60" rx="6" class="c-mask"/>
          <rect x="574.25" y="72" width="135" height="60" rx="6" class="c-database" style="--step:3" stroke-width="1.5"/>
          <g aria-hidden="true" class="semantic-sigil s-database" transform="translate(580.25 78) scale(0.6875)">
            <ellipse cx="8" cy="4" rx="5" ry="2"/>
            <path d="M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/>
          </g>
          <text x="641.75" y="108" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">docs/release.md</text>
          <text x="641.75" y="122" class="t-muted" font-size="7" text-anchor="middle">the spoke</text>
        </g>

        <g id="node-repo" role="button" aria-label="Focus Repository, tests, tags, Sequence participant" aria-pressed="false">
          <title>Repository · tests, tags · Sequence participant</title>
          <rect x="745" y="72" width="135" height="60" rx="6" class="c-mask"/>
          <rect x="745" y="72" width="135" height="60" rx="6" class="c-cloud" style="--step:4" stroke-width="1.5"/>
          <g aria-hidden="true" class="semantic-sigil s-cloud" transform="translate(751 78) scale(0.6875)">
            <path d="M4.3 12.5h7.3a2.4 2.4 0 0 0 .2-4.8 4 4 0 0 0-7.5-1.3A3.1 3.1 0 0 0 4.3 12.5Z"/>
          </g>
          <text x="812.5" y="108" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Repository</text>
          <text x="812.5" y="122" class="t-muted" font-size="7" text-anchor="middle">tests, tags</text>
        </g>

        <!-- Legend -->
        <g>
          <text x="40" y="564" class="t-primary" font-size="12" font-weight="650">Legend</text>
          <g>
            <path d="M 40 581 L 74 581" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
            <text x="83" y="584" class="t-muted" font-size="10" font-weight="500">main path of the task</text>
          </g>
          <g>
            <path d="M 236 581 L 270 581" class="a-default" stroke-width="1.4" stroke-dasharray="3,5" marker-end="url(#arrowhead)"/>
            <text x="279" y="584" class="t-muted" font-size="10" font-weight="500">reply or result</text>
          </g>
          <g>
            <path d="M 394 581 L 428 581" class="a-default" stroke-width="1.4" marker-end="url(#arrowhead)"/>
            <text x="437" y="584" class="t-muted" font-size="10" font-weight="500">call or message</text>
          </g>
        </g>
      </svg>
