<svg xmlns="http://www.w3.org/2000/svg" version="1.1" role="img" width="1180" height="300" viewBox="0 0 1180 300" font-family="Lato, Arial, 'Liberation Sans', Helvetica, sans-serif">
<title>Page content is data, not instructions</title>
<desc>The person&#x27;s request and the harness rules are trusted instructions. Everything that comes from a web page, including hidden text, is untrusted data. It crosses a boundary into the agent&#x27;s context only as quoted data, and an action the page suggests that is outward or destructive still goes through the person&#x27;s gates.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5763"/></marker></defs>
<rect x="0" y="0" width="1180" height="300" fill="#f5f6f8"/>
<path d="M290,90 L400,155" fill="none" stroke="#4f5763" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
<text x="345" y="70" font-size="14" fill="#15181d" text-anchor="middle" font-style="italic">instructions</text>
<path d="M290,225 L400,155" fill="none" stroke="#4f5763" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)" stroke-dasharray="7 5"/>
<text x="345" y="265" font-size="14" fill="#15181d" text-anchor="middle" font-style="italic">data only</text>
<path d="M700,155 L810,90" fill="none" stroke="#4f5763" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
<path d="M700,155 L810,225" fill="none" stroke="#4f5763" stroke-width="2" stroke-linejoin="round" marker-end="url(#a)"/>
<rect x="30" y="40" width="260" height="100" rx="10" fill="#fdf1e3" stroke="#9a5b13" stroke-width="2"/>
<text x="160" y="75" font-size="16" fill="#15181d" text-anchor="middle" font-weight="700">Trusted</text>
<text x="160" y="96" font-size="16" fill="#15181d" text-anchor="middle">the person&#x27;s request,</text>
<text x="160" y="116" font-size="16" fill="#15181d" text-anchor="middle">the harness rules</text>
<rect x="30" y="175" width="260" height="100" rx="10" fill="#f9e9e9" stroke="#8a2d2d" stroke-width="2"/>
<text x="160" y="210" font-size="16" fill="#15181d" text-anchor="middle" font-weight="700">Untrusted</text>
<text x="160" y="231" font-size="16" fill="#15181d" text-anchor="middle">page text, hidden text,</text>
<text x="160" y="251" font-size="16" fill="#15181d" text-anchor="middle">images, downloads</text>
<rect x="400" y="100" width="300" height="110" rx="10" fill="#e8f1f4" stroke="#0e5a75" stroke-width="2"/>
<text x="550" y="140" font-size="16" fill="#15181d" text-anchor="middle" font-weight="700">Agent context</text>
<text x="550" y="161" font-size="16" fill="#15181d" text-anchor="middle">instructions kept apart</text>
<text x="550" y="181" font-size="16" fill="#15181d" text-anchor="middle">from quoted page data</text>
<rect x="810" y="40" width="330" height="100" rx="10" fill="#eef3e8" stroke="#3f6b2a" stroke-width="2"/>
<text x="975" y="75" font-size="16" fill="#15181d" text-anchor="middle" font-weight="700">Gates</text>
<text x="975" y="96" font-size="16" fill="#15181d" text-anchor="middle">outward or destructive</text>
<text x="975" y="116" font-size="16" fill="#15181d" text-anchor="middle">actions still ask</text>
<rect x="810" y="175" width="330" height="100" rx="10" fill="#ffffff" stroke="#4f5763" stroke-width="2"/>
<text x="975" y="210" font-size="16" fill="#15181d" text-anchor="middle" font-weight="700">Read-only work</text>
<text x="975" y="231" font-size="16" fill="#15181d" text-anchor="middle">summaries, extraction,</text>
<text x="975" y="251" font-size="16" fill="#15181d" text-anchor="middle">screenshots</text>
</svg>
