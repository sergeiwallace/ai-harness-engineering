<text x="100" y="30" font-size="14" fill="#15181d" text-anchor="start" font-weight="700">Green: pass@k, any of k attempts succeeds.   Red: pass^k, all k attempts succeed.   p = 0.7</text>
<text x="100" y="360" font-size="14" fill="#15181d" text-anchor="start" font-weight="400">pass@k = 1 - (1 - p)^k        pass^k = p^k</text>
