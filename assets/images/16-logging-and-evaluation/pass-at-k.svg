<text x="465" y="189" font-size="16" fill="#15181d" text-anchor="middle" font-weight="700"></text>
<rect x="495" y="218" width="50" height="82" rx="10" fill="#f9e9e9" stroke="#8a2d2d" stroke-width="2"/>
<text x="520" y="265" font-size="16" fill="#15181d" text-anchor="middle" font-weight="700"></text>
<rect x="610" y="62" width="50" height="238" rx="10" fill="#eef3e8" stroke="#3f6b2a" stroke-width="2"/>
