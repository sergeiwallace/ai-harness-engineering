<title>pass@k and pass^k for an agent that solves a task 70 percent of the time</title>
<desc>Bar chart for a per-attempt success rate of 0.7. For k from 1 to 5, pass@k rises 0.70, 0.91, 0.97, 0.99, 1.00, while pass^k falls 0.70, 0.49, 0.34, 0.24, 0.17.</desc>
