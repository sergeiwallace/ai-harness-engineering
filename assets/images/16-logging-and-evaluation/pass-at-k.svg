<text x="805" y="186" font-size="16" fill="#15181d" text-anchor="middle" font-weight="700"></text>
<rect x="835" y="260" width="50" height="40" rx="10" fill="#f9e9e9" stroke="#8a2d2d" stroke-width="2"/>
<text x="860" y="286" font-size="16" fill="#15181d" text-anchor="middle" font-weight="700"></text>
<text x="125" y="124" font-size="13" fill="#15181d" text-anchor="middle" font-weight="400">0.70</text>
<text x="180" y="124" font-size="13" fill="#15181d" text-anchor="middle" font-weight="400">0.70</text>
<text x="295" y="74" font-size="13" fill="#15181d" text-anchor="middle" font-weight="400">0.91</text>
