<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 638" role="img" aria-labelledby="archify-diagram-title archify-diagram-description"><style>text{font-family:Inter,'Helvetica Neue',Helvetica,Arial,sans-serif}.c-grid{stroke: #e9edf2; fill: none;}.c-mask{fill: #ffffff; stroke: none;}.c-frontend{fill: rgba(34, 211, 238, 0.15);   stroke: #0891b2;}.c-backend{fill: rgba(52, 211, 153, 0.18);    stroke: #059669;}.c-messagebus{fill: rgba(251, 146, 60, 0.15); stroke: #ea580c;}.c-external{fill: rgba(148, 163, 184, 0.18);   stroke: #64748b;}.t-primary{fill: #111827;}.t-muted{fill: #5b6474;}.t-edge-emphasis{fill: #059669;}.t-edge-security{fill: #e11d48;}.t-edge-dashed{fill: #7c3aed;}.a-default{stroke: #64748b; fill: none;}.a-emphasis{stroke: #059669; fill: none;}.a-security{stroke: #e11d48; fill: none; stroke-dasharray: 5,5;}.a-dashed{stroke: #7c3aed; fill: none; stroke-dasharray: 4,4;}.m-default{fill: #64748b;}.m-emphasis{fill: #059669;}.m-security{fill: #e11d48;}.m-dashed{fill: #7c3aed;}.c-lane{fill: rgba(248, 250, 252, 0.65); stroke: #cbd5e1; stroke-dasharray: 6,6;}</style>
        <title id="archify-diagram-title">A rename across packages with /batch</title>
