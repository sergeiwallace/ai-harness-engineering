<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 658" role="img" aria-labelledby="archify-diagram-title archify-diagram-description"><style>text{font-family:Inter,'Helvetica Neue',Helvetica,Arial,sans-serif}.c-grid{stroke: #e9edf2; fill: none;}.c-mask{fill: #ffffff; stroke: none;}.c-frontend{fill: rgba(34, 211, 238, 0.15);   stroke: #0891b2;}.c-backend{fill: rgba(52, 211, 153, 0.18);    stroke: #059669;}.c-database{fill: rgba(167, 139, 250, 0.2);   stroke: #7c3aed;}.c-messagebus{fill: rgba(251, 146, 60, 0.15); stroke: #ea580c;}.t-primary{fill: #111827;}.t-muted{fill: #5b6474;}.t-edge-emphasis{fill: #059669;}.t-edge-dashed{fill: #7c3aed;}.a-default{stroke: #64748b; fill: none;}.a-emphasis{stroke: #059669; fill: none;}.a-dashed{stroke: #7c3aed; fill: none; stroke-dasharray: 4,4;}.m-default{fill: #64748b;}.m-emphasis{fill: #059669;}.m-security{fill: #e11d48;}.m-dashed{fill: #7c3aed;}.c-lane{fill: rgba(248, 250, 252, 0.65); stroke: #cbd5e1; stroke-dasharray: 6,6;}</style>
        <title id="archify-diagram-title">Waiting on a test run with a background shell and Monitor</title>
        <desc id="archify-diagram-description">A sequence diagram generated by Archify.</desc>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Time Segments -->
        <rect x="48" y="150" width="824" height="100" rx="10" class="c-lane" stroke-width="1"/>

        <rect x="48" y="262" width="824" height="158" rx="10" class="c-lane" stroke-width="1"/>

        <rect x="48" y="432" width="824" height="128" rx="10" class="c-lane" stroke-width="1"/>

        <!-- Lifelines -->
        <path d="M 149.5 142 L 149.5 562" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 363.83333333333337 142 L 363.83333333333337 562" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 578.1666666666667 142 L 578.1666666666667 562" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 792.5 142 L 792.5 562" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>

        <!-- Activations -->
        <rect x="144.5" y="160" width="10" height="385" rx="3" class="c-mask"/>
        <rect x="144.5" y="160" width="10" height="385" rx="3" class="c-backend" stroke-width="1"/>
        <rect x="358.83333333333337" y="165" width="10" height="290" rx="3" class="c-mask"/>
        <rect x="358.83333333333337" y="165" width="10" height="290" rx="3" class="c-database" stroke-width="1"/>
        <rect x="573.1666666666667" y="225" width="10" height="260" rx="3" class="c-mask"/>
        <rect x="573.1666666666667" y="225" width="10" height="260" rx="3" class="c-messagebus" stroke-width="1"/>

        <!-- Messages -->
        <g>
          <path d="M 156.5 165 L 356.83333333333337 165" class="a-emphasis" style="--step:0" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <g>
          <rect x="145.0666666666667" y="145" width="223.2" height="18" rx="3" class="c-mask"/>
          <text x="256.6666666666667" y="155" class="t-edge-emphasis" font-size="11" text-anchor="middle">run the suite, run_in_background</text>
        </g>
        </g>

        <g>
          <path d="M 356.83333333333337 195 L 156.5 195" class="a-default" style="--step:1" stroke-width="1.4" stroke-dasharray="3,5" marker-end="url(#arrowhead)"/>
        <g>
          <rect x="174.7666666666667" y="175" width="163.79999999999998" height="18" rx="3" class="c-mask"/>
          <text x="256.6666666666667" y="185" class="t-muted" font-size="11" text-anchor="middle">handle returned at once</text>
        </g>
        </g>

        <g>
          <path d="M 156.5 225 L 571.1666666666667 225" class="a-default" style="--step:2" stroke-width="1.4" marker-end="url(#arrowhead)"/>
        <g>
          <rect x="252.23333333333338" y="205" width="223.2" height="18" rx="3" class="c-mask"/>
          <text x="363.83333333333337" y="215" class="t-muted" font-size="11" text-anchor="middle">watch run.log for FAILED or EXIT</text>
        </g>
        </g>

        <g>
          <path d="M 156.5 280 L 785.5 280" class="a-default" style="--step:3" stroke-width="1.4" marker-end="url(#arrowhead)"/>
        <g>
          <rect x="399" y="260" width="144" height="18" rx="3" class="c-mask"/>
          <text x="471" y="270" class="t-muted" font-size="11" text-anchor="middle">read the sync module</text>
        </g>
        <text x="168.5" y="298" class="t-muted" font-size="7">no polling turns spent</text>
        </g>

        <g>
          <path d="M 370.83333333333337 335 L 571.1666666666667 335" class="a-dashed" style="--step:4" stroke-width="1.4" marker-end="url(#arrowhead-dashed)"/>
        <g>
          <rect x="385.80000000000007" y="315" width="170.39999999999998" height="18" rx="3" class="c-mask"/>
          <text x="471.00000000000006" y="325" class="t-edge-dashed" font-size="11" text-anchor="middle">FAILED test_lock_release</text>
        </g>
        </g>

        <g>
          <path d="M 571.1666666666667 365 L 156.5 365" class="a-emphasis" style="--step:5" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <g>
          <rect x="275.33333333333337" y="345" width="177" height="18" rx="3" class="c-mask"/>
          <text x="363.83333333333337" y="355" class="t-edge-emphasis" font-size="11" text-anchor="middle">line arrives as a message</text>
        </g>
        </g>

        <g>
          <path d="M 156.5 395 L 785.5 395" class="a-emphasis" style="--step:6" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <g>
          <rect x="395.7" y="375" width="150.6" height="18" rx="3" class="c-mask"/>
          <text x="471" y="385" class="t-edge-emphasis" font-size="11" text-anchor="middle">open the failing test</text>
        </g>
        </g>

        <g>
          <path d="M 370.83333333333337 450 L 571.1666666666667 450" class="a-dashed" style="--step:7" stroke-width="1.4" marker-end="url(#arrowhead-dashed)"/>
        <g>
          <rect x="445.20000000000005" y="430" width="51.599999999999994" height="18" rx="3" class="c-mask"/>
          <text x="471.00000000000006" y="440" class="t-edge-dashed" font-size="11" text-anchor="middle">EXIT 1</text>
        </g>
        </g>

        <g>
          <path d="M 571.1666666666667 480 L 156.5 480" class="a-default" style="--step:8" stroke-width="1.4" stroke-dasharray="3,5" marker-end="url(#arrowhead)"/>
        <g>
          <rect x="324.83333333333337" y="460" width="78" height="18" rx="3" class="c-mask"/>
          <text x="363.83333333333337" y="470" class="t-muted" font-size="11" text-anchor="middle">final line</text>
        </g>
        </g>

        <g>
          <path d="M 156.5 515 L 356.83333333333337 515" class="a-default" style="--step:9" stroke-width="1.4" marker-end="url(#arrowhead)"/>
        <g>
          <rect x="164.86666666666667" y="495" width="183.6" height="18" rx="3" class="c-mask"/>
          <text x="256.6666666666667" y="505" class="t-muted" font-size="11" text-anchor="middle">read the full log only now</text>
        </g>
        <text x="168.5" y="533" class="t-muted" font-size="7">unfiltered output stays in the file</text>
        </g>

        <!-- Segment Labels -->
        <g>
          <rect x="370.26666666666665" y="134" width="128.4" height="18" rx="3" class="c-mask"/>
          <text x="376.26666666666665" y="147" class="t-muted" font-size="9" font-weight="600">Start without blocking</text>
        </g>
        <g>
          <rect x="56" y="240" width="149.20000000000002" height="18" rx="3" class="c-mask"/>
          <text x="62" y="253" class="t-muted" font-size="9" font-weight="600">Keep working while it runs</text>
        </g>
        <g>
          <rect x="56" y="410" width="112.8" height="18" rx="3" class="c-mask"/>
          <text x="62" y="423" class="t-muted" font-size="9" font-weight="600">React to the result</text>
        </g>

        <!-- Participants -->
        <g id="node-agent" role="button" aria-label="Focus Agent, the model&#39;s turns, Sequence participant" aria-pressed="false">
          <title>Agent · the model&#39;s turns · Sequence participant</title>
          <rect x="62" y="72" width="175" height="60" rx="6" class="c-mask"/>
          <rect x="62" y="72" width="175" height="60" rx="6" class="c-backend" style="--step:0" stroke-width="1.5"/>
          <g aria-hidden="true" class="semantic-sigil s-backend" transform="translate(68 78) scale(0.6875)">
            <path d="M6 3 3 8l3 5M10 3l3 5-3 5"/>
          </g>
          <text x="149.5" y="108" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Agent</text>
          <text x="149.5" y="122" class="t-muted" font-size="7" text-anchor="middle">the model&#39;s turns</text>
        </g>

        <g id="node-shell" role="button" aria-label="Focus Background shell, pytest, writes run.log, Sequence participant" aria-pressed="false">
          <title>Background shell · pytest, writes run.log · Sequence participant</title>
          <rect x="276.33333333333337" y="72" width="175" height="60" rx="6" class="c-mask"/>
          <rect x="276.33333333333337" y="72" width="175" height="60" rx="6" class="c-database" style="--step:1" stroke-width="1.5"/>
          <g aria-hidden="true" class="semantic-sigil s-database" transform="translate(282.33333333333337 78) scale(0.6875)">
            <ellipse cx="8" cy="4" rx="5" ry="2"/>
            <path d="M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/>
          </g>
          <text x="363.83333333333337" y="108" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Background shell</text>
          <text x="363.83333333333337" y="122" class="t-muted" font-size="7" text-anchor="middle">pytest, writes run.log</text>
        </g>

        <g id="node-mon" role="button" aria-label="Focus Monitor, tail -f | grep, Sequence participant" aria-pressed="false">
          <title>Monitor · tail -f | grep · Sequence participant</title>
          <rect x="490.66666666666674" y="72" width="175" height="60" rx="6" class="c-mask"/>
          <rect x="490.66666666666674" y="72" width="175" height="60" rx="6" class="c-messagebus" style="--step:2" stroke-width="1.5"/>
          <g aria-hidden="true" class="semantic-sigil s-messagebus" transform="translate(496.66666666666674 78) scale(0.6875)">
            <path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/>
            <circle cx="5" cy="4.5" r="1" class="sigil-fill"/>
            <circle cx="10.5" cy="8" r="1" class="sigil-fill"/>
            <circle cx="7" cy="11.5" r="1" class="sigil-fill"/>
          </g>
          <text x="578.1666666666667" y="108" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Monitor</text>
          <text x="578.1666666666667" y="122" class="t-muted" font-size="7" text-anchor="middle">tail -f | grep</text>
        </g>

        <g id="node-code" role="button" aria-label="Focus Code, files the agent reads, Sequence participant" aria-pressed="false">
          <title>Code · files the agent reads · Sequence participant</title>
          <rect x="705" y="72" width="175" height="60" rx="6" class="c-mask"/>
          <rect x="705" y="72" width="175" height="60" rx="6" class="c-frontend" style="--step:3" stroke-width="1.5"/>
          <g aria-hidden="true" class="semantic-sigil s-frontend" transform="translate(711 78) scale(0.6875)">
            <rect x="2" y="3" width="12" height="10" rx="2"/>
            <path d="M2 6.5h12"/>
            <circle cx="4.1" cy="4.8" r=".7" class="sigil-fill"/>
            <circle cx="6.3" cy="4.8" r=".7" class="sigil-fill"/>
          </g>
          <text x="792.5" y="108" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Code</text>
          <text x="792.5" y="122" class="t-muted" font-size="7" text-anchor="middle">files the agent reads</text>
        </g>

        <!-- Legend -->
        <g>
          <text x="40" y="584" class="t-primary" font-size="12" font-weight="650">Legend</text>
          <g>
            <path d="M 40 601 L 74 601" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
            <text x="83" y="604" class="t-muted" font-size="10" font-weight="500">main path of the task</text>
          </g>
          <g>
            <path d="M 236 601 L 270 601" class="a-default" stroke-width="1.4" stroke-dasharray="3,5" marker-end="url(#arrowhead)"/>
            <text x="279" y="604" class="t-muted" font-size="10" font-weight="500">reply or result</text>
          </g>
          <g>
            <path d="M 394 601 L 428 601" class="a-dashed" stroke-width="1.4" marker-end="url(#arrowhead-dashed)"/>
            <text x="437" y="604" class="t-muted" font-size="10" font-weight="500">streamed line, no reply awaited</text>
          </g>
          <g>
            <path d="M 652 601 L 686 601" class="a-default" stroke-width="1.4" marker-end="url(#arrowhead)"/>
            <text x="695" y="604" class="t-muted" font-size="10" font-weight="500">call or message</text>
          </g>
        </g>
      </svg>
