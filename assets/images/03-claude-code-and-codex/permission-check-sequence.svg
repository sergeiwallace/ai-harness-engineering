        <path d="M 300.25 142 L 300.25 562" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 471 142 L 471 562" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>
