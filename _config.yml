title: "Agentic AI Workflows & Harness Engineering"
description: "Fundamentals & How to Build Your Own"
url: "https://sergeiwallace.github.io"
baseurl: "/ai-harness-engineering"

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-redirect-from

search_enabled: true
heading_anchors: true

kramdown:
  toc_levels: "2..3"

nav_sort: case_sensitive

mermaid:
  version: "11.4.1"

aux_links:
  "Repository":
    - "https://github.com/sergeiwallace/ai-harness-engineering"

exclude:
  - README.md
  - LICENSE
  - LICENSE-CONTENT
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - vendor
