# The talk deck at /talk/slides/ and how its slides map to site pages.
#
# index is the deck's 0-based slide number, so slide N opens at /talk/slides/#/N.
# The deck list follows the deck's own slide order. Keep it in step with the deck
# whenever the deck is rebuilt.
#
# sections maps a section folder name (the <NN-slug> in /sections/<NN-slug>/) to the
# slides that cover it, most relevant first. The header and footer navigation on every
# page under /sections/<NN-slug>/ links the first slide listed. "landing" is the
# site's landing page and "talk" is the talk page. A page can override the mapping
# with a front matter key, for example "slide: 17".
